<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Excel Report Manager</title></head><body><div id="root"></div><script>(()=>{const nativeOpen=window.open.bind(window);let primedPopup=null;document.addEventListener('click',e=>{const button=e.target&&e.target.closest?e.target.closest('button'):null;if(!button)return;const text=(button.textContent||'').trim();if(text!=='Connect Microsoft 365'&&text!=='Reconnect Microsoft 365')return;if(primedPopup&&!primedPopup.closed){try{primedPopup.close()}catch{}}primedPopup=nativeOpen('about:blank','nuvriqo-microsoft-oauth','popup=yes,width=620,height=760');if(primedPopup){try{primedPopup.document.title='Connecting to Microsoft 365';primedPopup.document.body.innerHTML='<p style="font-family:Arial,sans-serif;padding:24px">Preparing Microsoft sign-in…</p>'}catch{}}},true);window.open=(url,name,features)=>{if(name==='nuvriqo-microsoft-oauth'&&primedPopup&&!primedPopup.closed){const popup=primedPopup;primedPopup=null;if(url&&url!=='about:blank'){try{popup.location.replace(url)}catch{}}return popup}return nativeOpen(url,name,features)};})();</script><script type="module" src="/src/main.jsx"></script></body></html>
