modules:
  jiraServiceManagement:portalSubheader:
    - key: nuvriqo-portal-reports
      resource: portal-ui
      resolver:
        function: portal-resolver
      render: native
      unlicensedAccess:
        - customer
        - unlicensed

  function:
    - key: portal-resolver
      handler: index.handler

resources:
  - key: portal-ui
    path: src/frontend.jsx

permissions:
  scopes:
    - storage:app

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
