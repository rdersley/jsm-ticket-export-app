modules:
  jiraServiceManagement:portalSubheader:
    - key: nuvriqo-portal-reports
      resource: portal-ui
      resolver:
        function: portal-resolver
      render: native
      unlicensedAccess:
        - customer
        - unlicensed

  jira:adminPage:
    - key: nuvriqo-portal-companion-admin
      resource: companion-admin
      resolver:
        function: portal-resolver
      title: Portal Reports Companion
      render: native

  function:
    - key: portal-resolver
      handler: index.handler

resources:
  - key: portal-ui
    path: src/frontend.jsx
  - key: companion-admin
    path: src/admin.jsx

permissions:
  scopes:
    - storage:app
  external:
    fetch:
      backend:
        - "*.webtrigger.atlassian.app"

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
