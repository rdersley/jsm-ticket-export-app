modules:
  jira:globalPage:
    - key: nuvriqo-excel-report-manager
      resource: admin-ui
      resolver:
        function: resolver
      title: Excel Report Manager
      layout: blank

  jira:adminPage:
    - key: nuvriqo-excel-report-manager-admin
      resource: admin-ui
      resolver:
        function: resolver
      title: Excel Report Manager
      layout: blank

  jira:projectPage:
    - key: nuvriqo-excel-report-manager-project
      resource: admin-ui
      resolver:
        function: resolver
      title: Excel Report Manager
      layout: blank

  jira:issueNavigatorAction:
    - key: nuvriqo-excel-issue-navigator-export
      resource: navigator-ui
      resolver:
        function: resolver
      title: Export with Excel Report Manager
      tooltip: Export the current Jira search using a saved Excel template
      viewportSize: large

  scheduledTrigger:
    - key: report-dispatcher
      function: scheduler
      interval: fiveMinute

  consumer:
    - key: report-export-consumer
      queue: report-export-queue
      function: export-worker

  webtrigger:
    - key: microsoft-oauth-callback
      function: ms-oauth-callback
      urlFormat: v2

  function:
    - key: resolver
      handler: index.handler
    - key: scheduler
      handler: scheduled.handler
    - key: export-worker
      handler: asyncExport.handler
      timeoutSeconds: 900
    - key: ms-oauth-callback
      handler: microsoftOAuthCallback.handler

resources:
  - key: admin-ui
    path: static/admin-ui/dist
  - key: navigator-ui
    path: static/navigator-ui/dist

permissions:
  scopes:
    - read:jira-work
    - read:field:jira
    - read:filter:jira
    - storage:app
  external:
    fetch:
      backend:
        - address: https://login.microsoftonline.com
        - address: https://graph.microsoft.com
        - address: https://api.sendgrid.com

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/1e0f0b2e-20cf-444b-98bb-4d4cd67df86a
