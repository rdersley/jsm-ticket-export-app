modules:
  jira:globalPage:
    - key: nuvriqo-excel-report-manager
      resource: admin-ui
      resolver:
        function: resolver
      title: Excel Report Manager
      layout: blank

  jira:adminPage:
    - key: nuvriqo-excel-report-manager-admin
      resource: admin-ui
      resolver:
        function: resolver
      title: Excel Report Manager
      layout: blank
    - key: nuvriqo-excel-portal-reports-admin
      resource: portal-admin-ui
      resolver:
        function: portal-resolver
      title: Portal Reports
      layout: blank
      useAsConfig: true
    - key: nuvriqo-weekly-hardware-report-admin
      resource: hardware-ui
      resolver:
        function: resolver
      title: Weekly SD → Hardware Report
      layout: blank
      useAsGetStarted: true

  jira:projectPage:
    - key: nuvriqo-excel-report-manager-project
      resource: admin-ui
      resolver:
        function: resolver
      title: Excel Report Manager
      layout: blank

  jira:issueNavigatorAction:
    - key: nuvriqo-excel-issue-navigator-export
      resource: navigator-ui
      resolver:
        function: resolver
      title: Export with Excel Report Manager
      tooltip: Export the current Jira search using a saved Excel template
      viewportSize: large

  scheduledTrigger:
    - key: report-dispatcher
      function: scheduler
      interval: fiveMinute

  consumer:
    - key: report-export-consumer
      queue: report-export-queue
      function: export-worker
    - key: portal-report-consumer
      queue: portal-report-queue
      function: portal-worker

  function:
    - key: resolver
      handler: index.handler
    - key: scheduler
      handler: scheduled.handler
    - key: export-worker
      handler: asyncExport.handler
      timeoutSeconds: 900
    - key: portal-resolver
      handler: portalReports.handler
    - key: portal-customer
      handler: portalCustomer.handler
    - key: portal-probe
      handler: portalProbe.handler
    - key: portal-worker
      handler: portalReports.portalWorker
      timeoutSeconds: 900

resources:
  - key: admin-ui
    path: static/admin-ui/dist
  - key: hardware-ui
    path: static/hardware-ui/dist
  - key: navigator-ui
    path: static/navigator-ui/dist
  - key: portal-admin-ui
    path: static/portal-admin-ui/dist

permissions:
  scopes:
    - read:jira-work
    - read:field:jira
    - read:filter:jira
    - read:servicedesk-request
    - read:organization:jira-service-management
    - read:organization.user:jira-service-management
    - read:servicedesk.customer:jira-service-management
    - read:user:jira
    - storage:app
  external:
    fetch:
      backend:
        - address: https://login.microsoftonline.com
        - address: https://graph.microsoft.com
        - address: https://api.sendgrid.com

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/1e0f0b2e-20cf-444b-98bb-4d4cd67df86a
