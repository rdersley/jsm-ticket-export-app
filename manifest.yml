modules:
  jira:globalPage:
    - key: nuvriqo-excel-report-manager
      resource: admin-ui
      resolver:
        function: resolver
      title: Excel Report Manager
      layout: blank

  scheduledTrigger:
    - key: report-dispatcher
      function: scheduler
      interval: fiveMinute

  function:
    - key: resolver
      handler: index.handler
    - key: scheduler
      handler: scheduled.handler

resources:
  - key: admin-ui
    path: static/admin-ui/dist

permissions:
  scopes:
    - read:jira-work
    - read:field:jira
    - read:filter:jira
    - storage:app
  external:
    fetch:
      backend:
        - address: https://login.microsoftonline.com
        - address: https://graph.microsoft.com
        - address: https://api.sendgrid.com

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/1e0f0b2e-20cf-444b-98bb-4d4cd67df86a
