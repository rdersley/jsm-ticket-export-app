name: One-time timeout production release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/timeout-production-release-once.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Install Forge CLI
        run: npm install --global @forge/cli
      - name: Configure Forge CLI
        run: forge settings set usage-analytics false
      - name: Build Custom UI
        run: npm run build
      - name: Forge lint
        run: forge lint
      - name: Deploy production
        run: forge deploy -e production
      - name: Upgrade worksite install
        run: forge install --upgrade --non-interactive --site retailinmotion.atlassian.net --product jira -e production

# Triggered for lazy Jira metadata loading release.
