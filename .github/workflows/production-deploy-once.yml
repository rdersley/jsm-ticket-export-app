name: One-time production deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-deploy-once.yml'

# Retry Forge-native Microsoft 365 Easy Connect callback flow after manifest key fix 2026-09-11
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run regression tests
        run: npm test
      - name: Install Forge CLI
        run: npm install --global @forge/cli
      - name: Configure Forge CLI
        run: forge settings set usage-analytics false
      - name: Build Custom UI
        run: npm run build
      - name: Forge lint
        run: forge lint
      - name: Deploy to Forge production
        run: forge deploy -e production
      - name: Install or upgrade on Retail inMotion Jira
        shell: bash
        run: |
          forge install --upgrade --non-interactive --site retailinmotion.atlassian.net --product jira -e production || \
          forge install --non-interactive --site retailinmotion.atlassian.net --product jira -e production
