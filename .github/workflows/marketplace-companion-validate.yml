name: Marketplace Portal Reports Companion validation

on:
  push:
    branches:
      - marketplace-release
    paths:
      - 'portal-app/**'
      - '.github/workflows/marketplace-companion-validate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketplace-portal-companion-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}

    steps:
      - name: Checkout Marketplace branch
        uses: actions/checkout@v4
        with:
          ref: marketplace-release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Forge CLI
        run: npm install --global @forge/cli

      - name: Configure Forge CLI
        run: forge settings set usage-analytics false

      - name: Register separate companion Forge app
        id: register
        working-directory: portal-app
        shell: bash
        run: |
          if grep -q '00000000-0000-0000-0000-000000000000' manifest.yml; then
            SPACES_JSON="$(forge developer-spaces list --json)"
            SPACE_ID="$(printf '%s' "$SPACES_JSON" | jq -r '.. | objects | select(has("id")) | .id' | head -n 1)"
            if [ -z "$SPACE_ID" ] || [ "$SPACE_ID" = "null" ]; then
              echo "Could not determine Developer Space ID."
              exit 1
            fi
            forge register "Nuvriqo Portal Reports Companion" --accept-terms --developer-space-id "$SPACE_ID"
            echo "registered=true" >> "$GITHUB_OUTPUT"
          else
            echo "registered=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist companion app ID
        if: steps.register.outputs.registered == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal-app/manifest.yml
          git commit -m "Register Marketplace Portal Reports Companion"
          git push origin HEAD:marketplace-release

      - name: Stop after registration
        if: steps.register.outputs.registered == 'true'
        run: echo "Companion Forge app registered. The app ID commit will trigger validation."

      - name: Install companion dependencies
        if: steps.register.outputs.registered != 'true'
        working-directory: portal-app
        run: npm install

      - name: Companion security audit
        if: steps.register.outputs.registered != 'true'
        working-directory: portal-app
        run: npm audit --audit-level=high

      - name: Test companion
        if: steps.register.outputs.registered != 'true'
        working-directory: portal-app
        run: npm test

      - name: Forge lint companion
        if: steps.register.outputs.registered != 'true'
        working-directory: portal-app
        run: forge lint

      - name: Deploy companion to development
        if: steps.register.outputs.registered != 'true'
        working-directory: portal-app
        run: forge deploy -e development --approve MAJOR_VERSION_RULE --non-interactive
