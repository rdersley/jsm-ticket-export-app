name: Build validation and development deploy

on:
  push:
    branches:
      - main
      - feature/portal-reports
  pull_request:

concurrency:
  group: forge-development-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Run regression tests
        run: npm test

      - name: Install Forge CLI
        run: npm install --global @forge/cli

      - name: Configure Forge CLI for CI
        run: forge settings set usage-analytics false

      - name: Build Custom UI
        run: npm run build

      - name: Forge lint
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: forge lint

      - name: Deploy to Forge development
        if: github.event_name == 'push'
        run: forge deploy -e development --approve MAJOR_VERSION_RULE --non-interactive

      - name: Install or upgrade on Nuvriqo Jira
        if: github.event_name == 'push'
        shell: bash
        run: |
          forge install --upgrade --confirm-scopes --non-interactive --site nuvriqo.atlassian.net --product jira -e development || \
          forge install --confirm-scopes --non-interactive --site nuvriqo.atlassian.net --product jira -e development
