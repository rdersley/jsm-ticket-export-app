name: Build validation and development deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: forge-development-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Run regression tests
        run: npm test

      - name: Install Forge CLI
        run: npm install --global @forge/cli

      - name: Configure Forge CLI for CI
        run: forge settings set usage-analytics false

      - name: Build Custom UI
        run: npm run build

      - name: Deploy to Forge development with major-version approval
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: forge deploy -e development --approve MAJOR_VERSION_RULE --non-interactive

      - name: Install or upgrade on Nuvriqo Jira
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: forge install --upgrade --confirm-scopes --non-interactive --site nuvriqo.atlassian.net --product jira -e development
