name: Build validation and development deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Forge CLI
        run: npm install --global @forge/cli

      - name: Configure Forge CLI for CI
        run: forge settings set usage-analytics false

      - name: Build Custom UI
        run: npm run build

      - name: Forge lint
        run: forge lint

      - name: Deploy to Forge development
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: forge deploy -e development

      - name: Install or upgrade on Nuvriqo Jira
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          forge install --upgrade --non-interactive --site nuvriqo.atlassian.net --product jira -e development || \
          forge install --non-interactive --site nuvriqo.atlassian.net --product jira -e development
