name: Portal Reports bridge development

on:
  push:
    branches:
      - feature/portal-reports
    paths:
      - 'src/portalBridge.js'
      - 'src/portalCustomer.js'
      - 'manifest.yml'
      - 'portal-app/**'
      - '.github/workflows/portal-bridge-development.yml'
  workflow_dispatch:

concurrency:
  group: portal-reports-bridge-development
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/portal-reports

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Forge CLI
        run: npm install --global @forge/cli

      - name: Configure Forge
        run: forge settings set usage-analytics false

      - name: Install main app dependencies
        run: npm install

      - name: Build main app
        run: npm run build

      - name: Deploy report engine development
        run: forge deploy -e development --approve MAJOR_VERSION_RULE --non-interactive

      - name: Install or upgrade report engine on Nuvriqo
        shell: bash
        run: |
          forge install --upgrade --confirm-scopes --non-interactive --site nuvriqo.atlassian.net --product jira -e development || \
          forge install --confirm-scopes --non-interactive --site nuvriqo.atlassian.net --product jira -e development

      - name: Create secure bridge URL and token
        id: bridge
        shell: bash
        run: |
          TOKEN="$(openssl rand -hex 32)"
          forge variables set --encrypt -e development PORTAL_BRIDGE_TOKEN "$TOKEN"
          forge deploy -e development --approve MAJOR_VERSION_RULE --non-interactive

          URL="$(forge webtrigger create -f portal-bridge -s nuvriqo.atlassian.net -p Jira -e development | grep -Eo 'https://[^ ]+' | tail -n 1)"
          if [ -z "$URL" ]; then
            echo "Could not obtain Portal Reports bridge URL."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$URL"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Install portal app dependencies
        working-directory: portal-app
        run: npm install

      - name: Configure portal app bridge
        working-directory: portal-app
        shell: bash
        run: |
          forge variables set --encrypt -e development PORTAL_BRIDGE_TOKEN "${{ steps.bridge.outputs.token }}"
          forge variables set --encrypt -e development PORTAL_BRIDGE_URL "${{ steps.bridge.outputs.url }}"

      - name: Test Portal Reports app
        working-directory: portal-app
        run: npm test

      - name: Lint Portal Reports app
        working-directory: portal-app
        continue-on-error: true
        run: forge lint

      - name: Deploy Portal Reports development
        working-directory: portal-app
        run: forge deploy -e development --approve MAJOR_VERSION_RULE --non-interactive

      - name: Install or upgrade Portal Reports on Nuvriqo
        working-directory: portal-app
        shell: bash
        run: |
          forge install --upgrade --confirm-scopes --non-interactive --site nuvriqo.atlassian.net --product jira -e development || \
          forge install --confirm-scopes --non-interactive --site nuvriqo.atlassian.net --product jira -e development

      - name: Seed development Portal Reports smoke test
        shell: bash
        run: |
          forge variables set --encrypt -e development PORTAL_DEV_SEED_ENABLED true
          forge deploy -e development --approve MAJOR_VERSION_RULE --non-interactive
          curl -fsS -X POST "${{ steps.bridge.outputs.url }}" \
            -H "Authorization: Bearer ${{ steps.bridge.outputs.token }}" \
            -H "Content-Type: application/json" \
            --data '{"action":"seed-dev-report"}'

      - name: Generate development Portal Reports smoke test
        shell: bash
        run: |
          START="$(curl -fsS -X POST "${{ steps.bridge.outputs.url }}" \
            -H "Authorization: Bearer ${{ steps.bridge.outputs.token }}" \
            -H "Content-Type: application/json" \
            --data '{"action":"portal:run","accountId":"portal-ci-smoke","payload":{"reportId":"dev-portal-smoke-report"}}')"
          JOB_ID="$(printf '%s' "$START" | jq -r '.data.jobId // empty')"
          if [ -z "$JOB_ID" ]; then
            echo "Portal smoke report did not return a job id."
            echo "$START"
            exit 1
          fi

          for i in $(seq 1 90); do
            STATUS="$(curl -fsS -X POST "${{ steps.bridge.outputs.url }}" \
              -H "Authorization: Bearer ${{ steps.bridge.outputs.token }}" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg id "$JOB_ID" '{action:"portal:job-status",accountId:"portal-ci-smoke",payload:{jobId:$id}}')")"
            STATE="$(printf '%s' "$STATUS" | jq -r '.data.state // empty')"
            if [ "$STATE" = "ready" ]; then
              echo "Portal smoke report generated successfully."
              exit 0
            fi
            if [ "$STATE" = "failed" ]; then
              echo "$STATUS"
              exit 1
            fi
            sleep 2
          done

          echo "Portal smoke report generation timed out."
          exit 1
