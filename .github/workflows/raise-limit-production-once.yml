name: One-time 10000 ticket limit production release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/raise-limit-production-once.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update editor ticket limit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('static/admin-ui/src/main.jsx')
          s = p.read_text()
          s = s.replace('max="5000"', 'max="10000"')
          s = s.replace('Safety limit: 5,000 work items per workbook.', 'Safety limit: 10,000 work items per workbook.')
          p.write_text(s)
          PY
      - name: Commit editor limit
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add static/admin-ui/src/main.jsx
            git commit -m "Raise Excel report editor limit to 10000"
            git push origin HEAD:main
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Install Forge CLI
        run: npm install --global @forge/cli
      - name: Configure Forge CLI
        run: forge settings set usage-analytics false
      - name: Build Custom UI
        run: npm run build
      - name: Forge lint
        run: forge lint
      - name: Deploy production
        run: forge deploy -e production
      - name: Upgrade worksite install
        run: forge install --upgrade --non-interactive --site retailinmotion.atlassian.net --product jira -e production
