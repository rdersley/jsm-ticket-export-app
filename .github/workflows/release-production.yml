name: Release production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'marketplace/RELEASE_TRIGGER.txt'

concurrency:
  group: forge-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install main app dependencies
        run: npm install

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Run regression tests
        run: npm test

      - name: Install Forge CLI
        run: npm install --global @forge/cli

      - name: Configure Forge CLI
        run: forge settings set usage-analytics false

      - name: Build main app
        run: npm run build

      - name: Forge lint main app
        run: forge lint

      # Token rotation never leaves the Portal Reports app holding a token the
      # bridge rejects: the new token is accepted alongside the current one
      # (PORTAL_BRIDGE_TOKEN_NEXT), the portal app moves onto it, and only then
      # is it promoted. A run that stops part-way leaves both tokens valid.
      - name: Stage next Portal Reports bridge token
        id: token
        shell: bash
        run: |
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          forge variables set --encrypt -e production PORTAL_BRIDGE_TOKEN_NEXT "$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy Excel Report Manager production
        run: forge deploy -e production --approve MAJOR_VERSION_RULE --non-interactive

      - name: Upgrade Excel Report Manager on work Jira site
        shell: bash
        run: |
          forge install --upgrade --confirm-scopes --non-interactive --site retailinmotion.atlassian.net --product jira -e production || \
          forge install --confirm-scopes --non-interactive --site retailinmotion.atlassian.net --product jira -e production

      - name: Get production Portal Reports bridge URL
        id: bridge
        shell: bash
        run: |
          URL="$(forge webtrigger create -f portal-bridge -s retailinmotion.atlassian.net -p Jira -e production | grep -Eo 'https://[^ ]+' | tail -n 1)"
          if [ -z "$URL" ]; then
            echo "Could not obtain production Portal Reports bridge URL."
            exit 1
          fi
          echo "::add-mask::$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify production bridge accepts the new token
        shell: bash
        run: |
          # A fresh deployment can take a moment to serve the new token.
          for attempt in $(seq 1 12); do
            if curl -fsS -X POST "${{ steps.bridge.outputs.url }}" \
              -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
              -H "Content-Type: application/json" \
              --data '{"action":"ping"}' | grep -q '"ok":true'; then
              echo "Bridge accepted the new token (attempt $attempt)."
              exit 0
            fi
            echo "Bridge not ready yet (attempt $attempt of 12); retrying in 10s."
            sleep 10
          done
          echo "The production bridge did not accept the new token."
          exit 1

      - name: Install Portal Reports dependencies
        working-directory: portal-app
        run: npm install

      - name: Build Portal Reports Custom UI
        working-directory: portal-app
        run: npm run build

      - name: Configure Portal Reports production bridge
        working-directory: portal-app
        shell: bash
        run: |
          forge variables set --encrypt -e production PORTAL_BRIDGE_TOKEN "${{ steps.token.outputs.token }}"
          forge variables set --encrypt -e production PORTAL_BRIDGE_URL "${{ steps.bridge.outputs.url }}"

      - name: Test Portal Reports app
        working-directory: portal-app
        run: npm test

      - name: Lint Portal Reports app
        working-directory: portal-app
        continue-on-error: true
        run: forge lint

      - name: Deploy Portal Reports production
        working-directory: portal-app
        run: forge deploy -e production --approve MAJOR_VERSION_RULE --non-interactive

      - name: Install or upgrade Portal Reports on work Jira site
        working-directory: portal-app
        shell: bash
        run: |
          forge install --upgrade --confirm-scopes --non-interactive --site retailinmotion.atlassian.net --product jira -e production || \
          forge install --confirm-scopes --non-interactive --site retailinmotion.atlassian.net --product jira -e production

      - name: Promote the new Portal Reports bridge token
        shell: bash
        run: |
          forge variables set --encrypt -e production PORTAL_BRIDGE_TOKEN "${{ steps.token.outputs.token }}"
          forge variables unset -e production PORTAL_BRIDGE_TOKEN_NEXT
          forge deploy -e production --approve MAJOR_VERSION_RULE --non-interactive

      - name: Verify production bridge after promotion
        shell: bash
        run: |
          # A fresh deployment can take a moment to serve the new token.
          for attempt in $(seq 1 12); do
            if curl -fsS -X POST "${{ steps.bridge.outputs.url }}" \
              -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
              -H "Content-Type: application/json" \
              --data '{"action":"ping"}' | grep -q '"ok":true'; then
              echo "Bridge accepted the new token (attempt $attempt)."
              exit 0
            fi
            echo "Bridge not ready yet (attempt $attempt of 12); retrying in 10s."
            sleep 10
          done
          echo "The production bridge did not accept the new token."
          exit 1
