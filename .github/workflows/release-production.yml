name: Release production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'marketplace/RELEASE_TRIGGER.txt'

concurrency:
  group: forge-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Run regression tests
        run: npm test

      - name: Install Forge CLI
        run: npm install --global @forge/cli

      - name: Configure Forge CLI
        run: forge settings set usage-analytics false

      - name: Build Custom UI
        run: npm run build

      - name: Forge lint
        run: forge lint

      - name: Deploy to Forge production
        run: forge deploy -e production --approve MAJOR_VERSION_RULE --non-interactive

      - name: Upgrade production installation on work Jira site
        shell: bash
        run: |
          forge install --upgrade --confirm-scopes --non-interactive --site retailinmotion.atlassian.net --product jira -e production || \
          forge install --confirm-scopes --non-interactive --site retailinmotion.atlassian.net --product jira -e production
