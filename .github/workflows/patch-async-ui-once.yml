name: Patch async export UI once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-async-ui-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Run now and update lockfile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('static/admin-ui/src/main.jsx')
          s=p.read_text()
          old=" const run=async r=>{setBusy(true);setNotice(`Generating ${r.name}…`);try{const x=await invoke('report:run',{id:r.id});downloadBase64(x.workbookBase64,`${r.name}.xlsx`);setNotice(`Generated ${x.entry.issueCount} work items.`)}catch(e){setNotice(e.message||'Report failed.')}finally{setBusy(false)}};"
          new=""" const run=async r=>{\n  setBusy(true);setNotice(`Queued ${r.name}…`);let jobId;\n  try{\n   const started=await invoke('report:run:start',{id:r.id});jobId=started.jobId;setNotice(`Generating ${r.name} in the background…`);\n   for(let attempt=0;attempt<300;attempt++){\n    const status=await invoke('report:run:status',{jobId});\n    if(status.state==='ready'){\n     let base64='';for(let i=0;i<Number(status.chunkCount||0);i++)base64+=await invoke('report:run:chunk',{jobId,index:i});\n     downloadBase64(base64,status.filename||`${r.name}.xlsx`);\n     await invoke('report:run:cleanup',{jobId}).catch(()=>{});\n     setNotice(`Generated ${status.issueCount??0} work items in ${status.durationMs?Math.round(status.durationMs/1000)+'s':'the background'}.`);return;\n    }\n    if(status.state==='failed')throw new Error(status.message||'Report generation failed.');\n    if(status.state==='missing')throw new Error('The export job could not be found.');\n    await new Promise(resolve=>setTimeout(resolve,2000));\n   }\n   throw new Error('The report is still running. Please try again shortly.');\n  }catch(e){setNotice(e.message||'Report failed.');if(jobId)await invoke('report:run:cleanup',{jobId}).catch(()=>{})}finally{setBusy(false)}\n };"""
          if old not in s:
              raise SystemExit('Expected synchronous run function not found')
          p.write_text(s.replace(old,new))
          PY
          npm install --package-lock-only
      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "Nuvriqo CI"
          git config user.email "support@nuvriqo.com"
          git add static/admin-ui/src/main.jsx package-lock.json
          git commit -m "Use async worker for manual report exports"
          git push
