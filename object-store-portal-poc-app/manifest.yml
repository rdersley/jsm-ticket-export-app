modules:
  objectStore:
    - key: report-objects
      storageClass: standard

  jira:adminPage:
    - key: object-store-poc-admin
      resource: admin-ui
      resolver:
        function: admin-resolver
      title: Object Store Portal POC
      render: native

  jiraServiceManagement:portalSubheader:
    - key: object-store-poc-portal
      resource: portal-ui
      resolver:
        function: object-resolver
      render: native
      unlicensedAccess:
        - customer
        - unlicensed

  function:
    - key: admin-resolver
      handler: index.adminHandler
    - key: object-resolver
      handler: index.objectHandler

resources:
  - key: admin-ui
    path: src/admin.jsx
  - key: portal-ui
    path: src/portal.jsx

permissions:
  scopes:
    - read:jira-work
    - read:field:jira
    - read:filter:jira
    - read:servicedesk-request
    - read:servicedesk.customer:jira-service-management
    - read:user:jira
    - storage:app

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/be289346-cb2c-43e6-a392-a6c0ea5102ef
